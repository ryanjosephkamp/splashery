<title>Splashery Sound Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&display=swap"
/>
<style>
  :root {
    --page: #f5f7fb;
    --card: #ffffff;
    --ink: #141821;
    --muted: #5a6273;
    --line: #dce1eb;
    --accent: #0b4f9c;
    --accent-soft: #e6eef9;
    --on: #1f7a4d;
    --off: #9a4b12;
    --display: "Fredoka", ui-rounded, "Nunito", system-ui, sans-serif;
    --body: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #0f1218;
      --card: #181c25;
      --ink: #eef1f7;
      --muted: #9aa3b5;
      --line: #2a3140;
      --accent: #8db8ff;
      --accent-soft: #1b2638;
      --on: #6fd3a0;
      --off: #f0a86a;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0f1218;
    --card: #181c25;
    --ink: #eef1f7;
    --muted: #9aa3b5;
    --line: #2a3140;
    --accent: #8db8ff;
    --accent-soft: #1b2638;
    --on: #6fd3a0;
    --off: #f0a86a;
  }
  body {
    background: var(--page);
    color: var(--ink);
    font: 15px/1.45 var(--body);
    padding-inline: 16px;
    padding-block: 20px 48px;
  }
  .wrap {
    max-width: 1100px;
    margin: 0 auto;
    display: grid;
    gap: 18px;
  }
  h1 {
    font: 600 30px/1.1 var(--display);
    margin: 0;
    letter-spacing: 0.2px;
    text-wrap: balance;
  }
  h1 span {
    color: var(--accent);
  }
  .lede {
    margin: 6px 0 0;
    color: var(--muted);
    max-width: 62ch;
  }
  .bar {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 2;
    background: var(--page);
    padding-block: 10px;
    display: grid;
    gap: 10px;
    border-bottom: 1px solid var(--line);
  }
  #q {
    width: 100%;
    box-sizing: border-box;
    font: inherit;
    color: var(--ink);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 12px;
  }
  #q:focus-visible,
  button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .cats {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    scrollbar-width: none;
    padding-bottom: 2px;
  }
  .cats a {
    flex: none;
    text-decoration: none;
    color: var(--ink);
    font-size: 13px;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 5px 11px;
    background: var(--card);
  }
  section h2 {
    font: 600 19px/1.2 var(--display);
    margin: 14px 0 10px;
    display: flex;
    gap: 8px;
    align-items: baseline;
  }
  section h2 small {
    font: 13px var(--body);
    color: var(--muted);
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
    gap: 8px;
  }
  .toy {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 2px 8px;
    align-items: center;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 9px 10px;
    text-align: left;
    font: inherit;
    color: var(--ink);
    cursor: pointer;
    min-height: 58px;
    transition:
      border-color 0.15s,
      background 0.15s;
  }
  .toy .name {
    font-weight: 600;
    font-size: 14px;
  }
  .toy .desc {
    grid-column: 1 / -1;
    font-size: 12px;
    color: var(--muted);
    line-height: 1.3;
  }
  .toy .pair {
    display: flex;
    gap: 4px;
  }
  .toy .pair button {
    font: 600 11px var(--body);
    letter-spacing: 0.4px;
    text-transform: uppercase;
    border-radius: 7px;
    border: 1px solid var(--line);
    background: var(--page);
    padding: 4px 7px;
    cursor: pointer;
  }
  .toy .pair .on {
    color: var(--on);
  }
  .toy .pair .off {
    color: var(--off);
  }
  .toy .play {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: var(--accent-soft);
    display: grid;
    place-items: center;
  }
  .toy .play::before {
    content: "";
    border-left: 8px solid var(--accent);
    border-top: 5px solid transparent;
    border-bottom: 5px solid transparent;
    margin-left: 2px;
  }
  .toy.playing {
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .toy:hover {
    border-color: var(--accent);
  }
  .empty {
    color: var(--muted);
  }
  footer {
    color: var(--muted);
    font-size: 13px;
  }
  @media (prefers-reduced-motion: reduce) {
    .toy {
      transition: none;
    }
  }
</style>
<div class="wrap">
  <header>
    <h1>Splashery <span>Sound Board</span></h1>
    <p class="lede">
      Every toy's tap sound, synthesised live in your browser from the same code the app uses (built
      from main on @@BUILT@@). Tap a toy to hear it. Toys that switch on and off have two sounds.
      Turn your phone's volume up; nothing plays until your first tap.
    </p>
  </header>
  <div class="bar">
    <label for="q" hidden>Find a toy</label>
    <input
      id="q"
      type="search"
      placeholder="Find a toy (for example: duck, bell, guitar)"
      autocomplete="off"
    />
    <nav class="cats" id="cats" aria-label="Categories"></nav>
  </div>
  <main id="list"></main>
  <footer id="count"></footer>
</div>
<script>
  // @@SOUND-DATA@@: tools/sound-board.mjs puts src/voices.js and the toy data here.
  let ctx = null;
  let master = null;
  function audio() {
    if (!ctx) {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain();
      master.gain.value = 0.35;
      const limit = ctx.createDynamicsCompressor();
      limit.threshold.value = -10;
      limit.knee.value = 6;
      limit.ratio.value = 8;
      limit.attack.value = 0.003;
      limit.release.value = 0.2;
      master.connect(limit).connect(ctx.destination);
    }
    if (ctx.state === "suspended") ctx.resume();
    return ctx;
  }
  function play(el, spec) {
    const c = audio();
    const secs = playSpec(c, master, c.currentTime + 0.02, spec);
    el.classList.add("playing");
    clearTimeout(el._t);
    el._t = setTimeout(() => el.classList.remove("playing"), Math.max(300, secs * 1000));
  }
  const voiceList = (spec) =>
    [...new Set([...JSON.stringify(spec).matchAll(/"voice":"(\w+)"/g)].map((m) => m[1]))].join(
      " + ",
    );
  const list = document.getElementById("list");
  const cats = document.getElementById("cats");
  for (const c of CATS) {
    const n = TOYS.filter((t) => t.c === c.id).length;
    const a = document.createElement("a");
    a.href = "#" + c.id;
    a.textContent = c.label;
    cats.appendChild(a);
    const sec = document.createElement("section");
    sec.id = c.id;
    sec.innerHTML = `<h2>${c.label} <small>${n} toys</small></h2><div class="grid"></div>`;
    const grid = sec.querySelector(".grid");
    for (const t of TOYS.filter((t) => t.c === c.id)) {
      const spec = TOY_SOUNDS[t.id];
      const toggle = spec && !Array.isArray(spec) && typeof spec === "object" && "on" in spec;
      const el = document.createElement(toggle ? "div" : "button");
      el.className = "toy";
      el.dataset.search = (t.label + " " + t.id + " " + t.s + " " + voiceList(spec)).toLowerCase();
      const name = document.createElement("span");
      name.className = "name";
      name.textContent = t.label;
      const desc = document.createElement("span");
      desc.className = "desc";
      desc.textContent = t.s;
      if (toggle) {
        const pair = document.createElement("span");
        pair.className = "pair";
        for (const k of ["on", "off"]) {
          const b = document.createElement("button");
          b.type = "button";
          b.className = k;
          b.textContent = k;
          b.setAttribute("aria-label", `${t.label}: switch ${k}`);
          b.addEventListener("click", () => play(el, spec[k]));
          pair.appendChild(b);
        }
        el.append(name, pair, desc);
      } else {
        el.type = "button";
        el.setAttribute("aria-label", `Play ${t.label}`);
        const p = document.createElement("span");
        p.className = "play";
        el.append(name, p, desc);
        el.addEventListener("click", () => play(el, spec));
      }
      grid.appendChild(el);
    }
    list.appendChild(sec);
  }
  const count = document.getElementById("count");
  count.textContent = `${TOYS.length} toys, ${Object.keys(TOY_SOUNDS).length} sounds, ${VOICE_NAMES.length} voices.`;
  document.getElementById("q").addEventListener("input", (e) => {
    const q = e.target.value.trim().toLowerCase();
    for (const sec of list.children) {
      let shown = 0;
      for (const el of sec.querySelectorAll(".toy")) {
        const hit = !q || el.dataset.search.includes(q);
        el.hidden = !hit;
        if (hit) shown++;
      }
      sec.hidden = shown === 0;
    }
  });
</script>
