        b: "19-b.mp4",
      },

        id: "dot-train",
        category: "thin parts",
        source: {
          label: "Train on a viaduct (AI-made)",
          author: "Ryan, the owner of Splashery (made with an AI image tool)",
          source: "https://github.com/ryanjosephkamp/splashery/blob/main/CREDITS.md",
          license: "AI-made by the owner",
          ai: true,
        },
        a: "20-a.mp4",
        b: "20-b.mp4",
      },
    ];
    const answers = new Map();
    const host = document.getElementById("pairs");
    for (const pair of pairs) {
      const article = document.createElement("article");
      const heading = document.createElement("h2");
      heading.textContent = `Pair ${pair.number}: ${pair.category}`;
      article.append(heading);
      const views = document.createElement("div");
      views.className = "pair";
      const videos = [];
      for (const label of ["a", "b"]) {
        const frame = document.createElement("div");
        frame.className = "view";
        const title = document.createElement("strong");
        title.textContent = label.toUpperCase();
        const video = document.createElement("video");
        video.src = pair[label];
        video.controls = true;
        video.muted = true;
        video.playsInline = true;
        video.preload = "none";
        frame.append(title, video);
        views.append(frame);
        videos.push(video);
      }
      article.append(views);
      const play = document.createElement("button");
      play.textContent = "Play both";
      play.onclick = () => {
        for (const v of videos) v.currentTime = 0;
        for (const v of videos) v.play().catch(() => {});
      };
      article.append(play);
      const choices = document.createElement("fieldset");
      const legend = document.createElement("legend");
      legend.textContent = "Which looks better?";
      choices.append(legend);
      for (const value of ["A", "B", "Tie"]) {
        const label = document.createElement("label");
        const radio = document.createElement("input");
        radio.type = "radio";
        radio.name = `pair-${pair.number}`;
        radio.value = value;
        radio.onchange = () => {
          answers.set(pair.number, value);
          document.getElementById("save").textContent = `Save choices (${answers.size}/20)`;
        };
        label.append(radio, document.createTextNode(` ${value}`));
        choices.append(label);
      }
      article.append(choices);
      const credit = document.createElement("p");
      credit.className = "credit";
      const ai = pair.source.ai || (pair.source.license || "").startsWith("AI-made");
      credit.textContent = `${ai ? "AI-made Studio input. " : ""}${pair.source.label || pair.id}. ${pair.source.author || "Source credit in the review record"}. ${pair.source.license || "See the source record"}. `;
      if (pair.source.source) {
        const link = document.createElement("a");
        link.href = pair.source.source;
        link.textContent = "Source";
        credit.append(link);
      }
      article.append(credit);
      host.append(article);
    }
    document.getElementById("save").onclick = () => {
      if (answers.size !== 20) {
        alert(`Choose an answer for the remaining ${20 - answers.size} pairs.`);
        return;
      }
      const rows = pairs.map((p) => ({
        number: p.number,
        id: p.id,
        choice: answers.get(p.number),
      }));
      const url = URL.createObjectURL(
        new Blob([JSON.stringify({ reviewedUTC: new Date().toISOString(), rows }, null, 2)], {
          type: "application/json",
        }),
      );
      const link = document.createElement("a");
      link.href = url;
      link.download = "photo-3d-next-votes.json";
      link.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    };
