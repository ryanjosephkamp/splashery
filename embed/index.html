<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Splashery scene</title>
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="light dark" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%23b45a2c'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="../styles.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "../vendor/three/three.module.js"
        }
      }
    </script>
    <script type="module" src="../src/embed.js"></script>
  </head>
  <body class="embed">
    <canvas
      id="stage"
      tabindex="0"
      role="img"
      aria-label="A painted planet. Drag to turn it, scroll to zoom."
    ></canvas>
    <a id="open-link" class="open-link" href="../" target="_top" rel="noopener"
      >Open in Splashery</a
    >
    <div id="embed-status" class="embed-status" role="status" aria-live="polite" hidden></div>
    <section id="fallback" class="fallback" hidden>
      <h2>Splashery needs WebGL2</h2>
      <p id="fallback-reason">
        This browser could not start WebGL2, so the scene cannot be shown here.
      </p>
    </section>
  </body>
</html>
