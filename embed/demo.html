<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Splashery embeds</title>
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="light dark" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cg opacity='.92'%3E%3Cellipse cx='24' cy='26' rx='14' ry='11' fill='%23ff5fa2'/%3E%3Cellipse cx='40' cy='24' rx='12' ry='13' fill='%237bdff2'/%3E%3Cellipse cx='33' cy='41' rx='15' ry='11' fill='%23ffd166'/%3E%3C/g%3E%3C/svg%3E"
    />
    <style>
      :root {
        color-scheme: light dark;
        font:
          15px/1.5 ui-sans-serif,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      body {
        max-width: 760px;
        margin: 0 auto;
        padding: 24px 16px 48px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 16px;
      }
      splashery-toy,
      iframe {
        width: 100%;
        border-radius: 12px;
        border: 1px solid rgba(128, 128, 128, 0.35);
      }
      code {
        font-size: 13px;
      }
    </style>
    <script type="module" src="../src/element.js"></script>
  </head>
  <body>
    <h1>Splashery embeds</h1>
    <p>
      Two ways to put a toy on a page. The iframe works everywhere; the
      <code>&lt;splashery-toy&gt;</code> element needs one script tag and no iframe.
    </p>
    <div class="grid">
      <figure>
        <iframe
          id="demo-iframe"
          src="./?toy=donut"
          width="400"
          height="300"
          title="Splashery toy"
          loading="lazy"
        ></iframe>
        <figcaption>iframe: <code>embed/?toy=donut</code></figcaption>
      </figure>
      <figure>
        <splashery-toy id="demo-element" toy="cactus" autoplay="breeze"></splashery-toy>
        <figcaption>
          element: <code>&lt;splashery-toy toy="cactus" autoplay="breeze"&gt;</code>
        </figcaption>
      </figure>
    </div>
  </body>
</html>
