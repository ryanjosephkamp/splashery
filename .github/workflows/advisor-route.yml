# Task 84: the full evidence walk is separate from the regression suite.
name: Advisor route evidence

on:
  workflow_dispatch:
    inputs:
      payload:
        description: QR payload
        default: https://ryanjosephkamp.github.io/splashery/
        type: string
  pull_request:
    branches: [main]
    paths:
      - tools/adv-route.mjs
      - tests/cdx-adv.spec.mjs
      - .github/workflows/advisor-route.yml

permissions:
  contents: read

concurrency:
  group: advisor-route-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start the static server
        run: python3 -m http.server 4173 --bind 127.0.0.1 > "$RUNNER_TEMP/advisor-server.log" 2>&1 &
      - name: Run the route three times
        env:
          ADV_PAYLOAD: ${{ inputs.payload || 'https://ryanjosephkamp.github.io/splashery/' }}
          ADV_OUT: ${{ runner.temp }}/advisor-route
        run: node tools/adv-route.mjs
      - name: Run the targeted regression even when a route fails
        if: always()
        run: npx playwright test tests/cdx-adv.spec.mjs
      - name: Upload evidence even when a route fails
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: advisor-route-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/advisor-route
            ${{ runner.temp }}/advisor-server.log
            test-results/
          retention-days: 14
          if-no-files-found: error
